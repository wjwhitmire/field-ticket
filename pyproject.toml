[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "field_ticket"
version = "1.0.0"
description = "Estimates, field tickets, and invoices: integer-cent totals, tax rounding, due dates, and shift hours."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Will Whitmire" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
field-ticket = "field_ticket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
